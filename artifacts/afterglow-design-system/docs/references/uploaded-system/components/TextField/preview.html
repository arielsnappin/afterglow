<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField — preview</title></head>
<body>
<div id="root" class="ag-demo ag-demo--col" style="gap:16px"></div>
<script>
  var A = window.Afterglow, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(A.TextField, { label: 'Event name', placeholder: 'Rooftop szn', hint: 'Make it fun — people decide in 2 seconds.' }),
      h(A.TextField, { label: 'Leave a note for the host', placeholder: 'Bringing my famous dip 🥑', multiline: true }),
      h(A.TextField, { label: 'Phone', defaultValue: '555-01', error: 'That number looks short.' })
    )
  );
</script>
</body>
</html>
